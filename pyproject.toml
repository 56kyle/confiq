[project]
name = "confiq"
version = "0.1.0"
description = "confiq"
authors = [
    { name = "Kyle Oliver", email = "56kyleoliver@gmail.com" },
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10,<4.0"
keywords = [
    "confiq",
]
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Development Status :: 3 - Alpha"
]
dependencies = [
    "pluggy>=1.5",
    "pydantic>=2.5",
    "typing-extensions>=4.13.2",
]

[project.optional-dependencies]
yaml   = ["pyyaml>=6.0"]
toml   = ["tomli>=2.0; python_version<'3.11'"]
cli    = ["click>=8.1", "typer>=0.15.4"]
dotenv = ["python-dotenv>=1.2.2"]
remote = ["fsspec>=2026.4.0"]
reload = ["blinker>=1.7"]
aws    = ["boto3>=1.34"]
gcp    = ["google-cloud-secret-manager>=2.18"]
azure  = ["azure-identity>=1.15", "azure-keyvault-secrets>=4.7"]
vault  = ["hvac>=2.0"]
consul = ["py-consul>=1.7"]
s3     = ["confiq[remote]", "s3fs>=2026.4.0"]
gcs    = ["confiq[remote]", "gcsfs>=2026.4.0"]
adl    = ["confiq[remote]", "adlfs>=2024.7.0"]
common = ["confiq[yaml,toml]"]
all    = ["confiq[yaml,toml,cli,dotenv,remote,reload,aws,gcp,azure,vault,consul,s3,gcs,adl]"]

[dependency-groups]
dev = [
    "blinker>=1.7",
    "commitizen>=4.7.0",
    "nox>=2025.5.1",
    "pre-commit>=4.2.0",
    "pre-commit-hooks>=5.0.0",
    "ruff>=0.11.9",
    "bandit>=1.8.3",
    "pip-audit>=2.9.0",
    "pytest>=8.3.5",
    "pytest-cov>=6.1.1",
    "basedpyright>=1.34.0",
]
docs = [
    "furo>=2024.8.6",
    "myst-parser>=3.0.1",
    "sphinx>=7.4.7",
    "sphinx-autobuild>=2024.10.3",
    "sphinx-autodoc-typehints>=2.3.0",
    "sphinx-copybutton>=0.5.2",
    "sphinx-tabs>=3.4.7",
]

[project.urls]
Homepage = "https://github.com/56kyle/confiq"
Repository = "https://github.com/56kyle/confiq"

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
