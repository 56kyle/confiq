[project]
name = "confiq"
version = "0.1.0"
description = "confiq"
authors = [
    { name = "Kyle Oliver", email = "56kyleoliver@gmail.com" },
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10,<4.0"
keywords = [
    "confiq",
]
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Development Status :: 1 - Planning"
]
dependencies = [
    "loguru>=0.7.3",
    "platformdirs>=4.3.8",
    "pluggy>=1.5",
    "pydantic>=2.5",
    "python-dotenv>=1.2.2",
    "typer>=0.15.4",
    "typing-extensions>=4.13.2",
]

[project.optional-dependencies]
yaml   = ["pyyaml>=6.0"]
toml   = ["tomli>=2.0; python_version<'3.11'"]
watch  = ["watchdog>=4.0"]
click  = ["click>=8.1"]
aws    = ["boto3>=1.34"]
gcp    = ["google-cloud-secret-manager>=2.18"]
azure  = ["azure-identity>=1.15", "azure-keyvault-secrets>=4.7"]
vault  = ["hvac>=2.0"]
consul = ["py-consul>=1.7"]
common = ["confiq[yaml,toml,watch]"]
all    = ["confiq[yaml,toml,watch,click,aws,gcp,azure,vault,consul]"]

[dependency-groups]
dev = [
    "commitizen>=4.7.0",
    "nox>=2025.5.1",
    "pre-commit>=4.2.0",
    "pre-commit-hooks>=5.0.0",
    "ruff>=0.11.9",
    "bandit>=1.8.3",
    "pip-audit>=2.9.0",
    "pytest>=8.3.5",
    "pytest-cov>=6.1.1",
    "basedpyright>=1.34.0",
]
docs = [
    "furo>=2024.8.6",
    "myst-parser>=3.0.1",
    "sphinx>=7.4.7",
    "sphinx-autobuild>=2024.10.3",
    "sphinx-autodoc-typehints>=2.3.0",
    "sphinx-copybutton>=0.5.2",
    "sphinx-tabs>=3.4.7",
    "sphinxcontrib-typer>=0.5.1",
]

[project.entry-points."confiq.sources"]
file     = "confiq.sources.file:FileSource"
env      = "confiq.sources.env:EnvSource"
argparse = "confiq.sources.argparse_source:ArgparseSource"
dict     = "confiq.sources.dict_source:DictSource"

[project.entry-points.confiq]

[project.urls]
Homepage = "https://github.com/56kyle/confiq"
Repository = "https://github.com/56kyle/confiq"

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
